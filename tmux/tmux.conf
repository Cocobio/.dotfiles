#-------------------------------------#
#      Changing prefix trigger
#-------------------------------------#
unbind C-b
unbind C-a
set-option -sg escape-time 0
set-option -g prefix C-a

# unbind C-/
# set-option -g focus-events on
# set-window-option -g mode-keys vi


#-------------------------------------#
#           Update config
#-------------------------------------#
bind-key r source-file ~/.tmux.conf

#-------------------------------------#
#           Enable mouse
#-------------------------------------#
set -g mouse on

#-------------------------------------#
#          Window options
#-------------------------------------#
set -g renumber-windows on

# 1000ms rather than tmux's stock 500: the window in which a -r binding accepts
# the next press without the prefix. Each press resets it, so this only matters
# when you pause. It also governs the built-in repeats -- prefix+C-arrows and
# M-arrows for resize, prefix+S-arrows for scrolling the view.
set -g repeat-time 1000

# Cycle windows without re-pressing the prefix: after prefix+C-n, further C-n
# (or C-p) keep stepping for as long as you stay within repeat-time. These keys
# are already bound by default; the only change is the -r flag.
bind-key -r C-n next-window
bind-key -r C-p previous-window
unbind &
bind-key X kill-window
# bind-key > swap-window -t :+
# bind-key < swap-window -t :-

#-------------------------------------#
#          Spliting panes
#-------------------------------------#
unbind %
unbind '"'
bind-key | split-window -h
bind-key - split-window -v

#-------------------------------------#
#          Pane navigation
#-------------------------------------#
unbind -n C-h
unbind -n C-l
unbind -n C-j
unbind -n C-k
# Pane navigation that stops at the edge instead of wrapping. tmux
# select-pane -L/-R wraps by default -- from the leftmost pane, -L jumps to the
# rightmost one -- so the move is guarded by the edge flag.
#
# The guard is inverted (#{?pane_at_left,0,1}) so the "at the edge" case is the
# FALSE branch, which if-shell simply does not run. No else branch, and no fork:
# -F evaluates the flag as a format, which tmux already knows.
# The default prefix+arrow pane moves are bare select-pane, so they wrap.
# Removed rather than guarded: C-M-hjkl above is the one way to move.
unbind Up
unbind Down
unbind Left
unbind Right

bind-key -n C-M-h if-shell -F '#{?pane_at_left,0,1}'   'select-pane -L'
bind-key -n C-M-l if-shell -F '#{?pane_at_right,0,1}'  'select-pane -R'
bind-key -n C-M-j if-shell -F '#{?pane_at_bottom,0,1}' 'select-pane -D'
bind-key -n C-M-k if-shell -F '#{?pane_at_top,0,1}'    'select-pane -U'
# bind-key -n C-H select-pane -L
# bind-key -n C-l select-pane -R
# bind-key -n C-j select-pane -D
# bind-key -n C-k select-pane -U
unbind o
# unbind ;
unbind '{'
unbind '}'

#-------------------------------------#
#           Pane resizing
#-------------------------------------#
# Ctrl+Alt+uiop, matching the Hyprland window-resize row one layer up:
#   u narrower   i taller   o shorter   p wider
#
# The "i" is bound as M-Tab, not C-M-i, and that is not a mistake. Ctrl+I is
# byte-identical to Tab (0x09) -- the same ancient aliasing as Ctrl+M/Enter and
# Ctrl+[/Escape -- so the terminal delivers Ctrl+Alt+I as M-Tab and tmux never
# sees C-M-i. Verified by pressing the key, and tmux's extended-keys (even
# "always", negotiated from client startup) does not separate them.
#
# Binding M-Tab is safe here because Hyprland grabs a real ALT+Tab for its
# last-focus bounce, so M-Tab cannot arrive from anything except Ctrl+Alt+I.
bind-key -n C-M-u resize-pane -L 2
bind-key -n M-Tab resize-pane -D 2
bind-key -n C-M-o resize-pane -U 2
bind-key -n C-M-p resize-pane -R 2

# Swap the pane with its neighbour, mirroring Hyprland's SUPER+SHIFT+hjkl.
# tmux has no directional pane move: move-pane is an alias for join-pane (it
# relocates a pane into another WINDOW), and swap-pane -U/-D walk the pane
# INDEX order, not the geometry. The {left-of} family of targets does resolve
# geometrically, so swapping against those gives a true directional move.
# Guarded on the edge flags for the same reason as the navigation binds above:
# without it, the targets fall back to another pane and the swap goes sideways.
bind-key -n M-H if-shell -F "#{?pane_at_left,0,1}"   "swap-pane -s '{left-of}'"
bind-key -n M-J if-shell -F "#{?pane_at_bottom,0,1}" "swap-pane -s '{down-of}'"
bind-key -n M-K if-shell -F "#{?pane_at_top,0,1}"    "swap-pane -s '{up-of}'"
bind-key -n M-L if-shell -F "#{?pane_at_right,0,1}"  "swap-pane -s '{right-of}'"

# Windows by number, all under the prefix so nothing competes with what the
# shell or an application might want:
#   prefix + <n>        select window N        (stock tmux, untouched)
#   prefix + Alt + <n>  send this pane to N    -- the counterpart of Hyprland's
#                                                 SUPER+SHIFT+<n>
#
# This replaces tmux's stock prefix+M-1..7 layout presets. Layouts are still
# reachable: prefix+Space cycles them and prefix+E spreads panes evenly.
#
# base-index is 0, so window 0 is a real window and gets a binding too.
bind-key -T prefix M-0 run-shell "$HOME/.local/bin/tmux-pane-to #{pane_id} 0"
bind-key -T prefix M-1 run-shell "$HOME/.local/bin/tmux-pane-to #{pane_id} 1"
bind-key -T prefix M-2 run-shell "$HOME/.local/bin/tmux-pane-to #{pane_id} 2"
bind-key -T prefix M-3 run-shell "$HOME/.local/bin/tmux-pane-to #{pane_id} 3"
bind-key -T prefix M-4 run-shell "$HOME/.local/bin/tmux-pane-to #{pane_id} 4"
bind-key -T prefix M-5 run-shell "$HOME/.local/bin/tmux-pane-to #{pane_id} 5"
bind-key -T prefix M-6 run-shell "$HOME/.local/bin/tmux-pane-to #{pane_id} 6"
bind-key -T prefix M-7 run-shell "$HOME/.local/bin/tmux-pane-to #{pane_id} 7"
bind-key -T prefix M-8 run-shell "$HOME/.local/bin/tmux-pane-to #{pane_id} 8"
bind-key -T prefix M-9 run-shell "$HOME/.local/bin/tmux-pane-to #{pane_id} 9"

# prefix + C-Space cycles the layout, then C-Space ALONE keeps cycling.
#
# Done with a dedicated key table rather than the -r repeat flag: -r only
# accepts the next press within repeat-time, which is 500ms here -- too brisk to
# look at each layout before deciding. The table has no timeout at all.
#
# Escape, Enter or q leave the table. Binding an explicit exit matters: a key
# that is NOT in a custom table is swallowed on the press that returns you to
# the root table, so without these you would lose a keystroke getting out.
bind-key C-Space {
  next-layout
  switch-client -T layouts
  display-message -d 900 "layout — C-Space forward, C-M-Space back, Esc exits"
}
bind-key -T layouts C-Space   { next-layout     ; switch-client -T layouts }
# Backwards, and only inside this table -- Ctrl+Alt+Space does arrive
# distinctly as C-M-Space, unlike Ctrl+SHIFT+Space, where the terminal drops
# the shift and delivers a plain C-Space. Alt survives because it is sent as
# an ESC prefix rather than folded into the control code.
bind-key -T layouts C-M-Space { previous-layout ; switch-client -T layouts }
bind-key -T layouts Space     { next-layout     ; switch-client -T layouts }
bind-key -T layouts Escape  switch-client -T root
bind-key -T layouts Enter   switch-client -T root
bind-key -T layouts q       switch-client -T root

#-------------------------------------#
#      Naming & renaming windows
#-------------------------------------#
set -g allow-rename off

# Let terminal graphics (kitty protocol) survive tmux, so image logos and icat
# work inside panes. "all" rather than "on": with "on" tmux forwards the
# passthrough only while the pane is VISIBLE, so anything drawing an image in a
# background window -- every pane but one after a resurrect restore -- silently
# loses its payload and renders as a blank gap.
# GUARD: the option itself is tmux 3.3 and the "all" value is 3.4, so an older
# tmux errors on both. "all" also covers invisible panes, which is what makes
# fastfetch's logo survive a resurrect restore; "on" (3.3) only covers visible
# ones, and below 3.3 there is no passthrough at all -- kitty graphics simply do
# not render through tmux there.
%if '#{||:#{e|>|:#{s/\..*$//:#{s/[a-z]//:version}},3},#{&&:#{==:#{s/\..*$//:#{s/[a-z]//:version}},3},#{e|>=|:#{s/^.*\.//:#{s/[a-z]//:version}},4}}}'
    set -g allow-passthrough all
%elif '#{&&:#{==:#{s/\..*$//:#{s/[a-z]//:version}},3},#{e|>=|:#{s/^.*\.//:#{s/[a-z]//:version}},3}}'
    set -g allow-passthrough on
%endif

set -g set-titles on

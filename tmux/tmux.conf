# prefix+s opens a floating tree of sessions -> windows -> panes, and the client
# switches as the highlight moves, so the windows BEHIND the popup show what is
# under the cursor. q or Escape puts you back where you started.
#
# Neither built-in could do both: choose-tree has the tree but is a pane mode
# with a fixed key table and no callback on selection change, and it cannot be
# hosted by display-popup; an fzf picker can drive a live preview but its list is
# flat. ~/.local/bin/tmux-tree owns the loop, so it gets the tree AND the
# preview, plus pane-level selection.
#
# Guarded: display-popup needs tmux >= 3.2, so the script reports whether this
# machine can do it and the key is only rebound when it can. Anywhere else (an
# old tmux, termux) the stock choose-tree -Zs binding is left untouched.
if-shell -b "$HOME/.local/bin/tmux-tree --supported" \
  "bind-key s display-popup -E -w 45% -h 45% '$HOME/.local/bin/tmux-tree'"


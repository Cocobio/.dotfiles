# Note: the pill glyph is only re-read when the status line repaints. tmux has
# no hook for "the command in a pane changed", so on a window with an explicit
# name -- where tmux switches automatic-rename off -- a newly started program
# keeps the old glyph until the next repaint (status-interval, a prefix press,
# switching window/pane). Accepted deliberately: the alternatives were polling
# the status line on a timer, or moving window labels out of #{window_name},
# which is the only field tmux-resurrect persists.
set -g window-status-format "$WinFg#[bg=default]$WinTxt$WinBg#{?window_zoomed_flag,󰊓,$WinIcon} #I  #W $WinFg#[bg=default]"
# The bar is waybar's island colour, and the pills sit on it exactly as the
# workspace pills sit on the island there: mantle behind, surface0 fill. waybar
# uses alpha(#181825, 0.92); tmux styles have no alpha, so solid mantle is the
# closest match. Every cap must sit on that same backdrop or it paints a coloured
# notch around its pill -- but it names it as #[bg=default] rather than $Mantle,
# so the caps follow the status line (and the terminal) instead of stamping this
# palette's mantle over a different background. The separator between pills is a
# plain space with no style of its own, so it already inherits the same thing.
# The islands' outer caps and the padding use #[bg=default] rather than naming
# this colour again: default resolves to whatever the status line (and hence the
# terminal) is using, so the bar keeps working when the terminal background or
# its opacity differs. Note the caps still need an explicit reset -- they follow
# a pill's own fill, and without one they would be drawn pill-on-pill and vanish.
# bg=default, not $Mantle: the caps and padding already resolve to the terminal
# background, so the bar must too or the two disagree wherever the terminal is
# not mantle. kitty's background is set to #181825 (mantle) so this is a no-op
# here; Windows Terminal's Catppuccin Mocha uses base #1E1E2E, and there the bar
# now matches its own caps instead of painting this palette's mantle over them.
set-option -g status-style bg=default,fg="${Text}"

# Centred, to match the waybar centre island.
set -g status-justify centre
set -g status-position top

#+--- Panes ---+
set -g pane-border-style "fg=$Surface1"
set -g pane-active-border-style "#{?client_prefix,fg=$Sky,fg=$Blue}"
set -g pane-border-status top
# Pane header: a numbered circle, the pane's program glyph (the same WinIcon
# chain the window pills use, so a pane and a tab are labelled identically), and
# the command. Replaces "(1)" and the bare #[reverse], which was the last bit of
# styling that ignored the palette.
#
# The circle is FILLED on the active pane and outline elsewhere, so the focused
# pane is legible from shape alone, not just from the border colour. Panes are
# 0-indexed here (pane-base-index 0) and the glyph family runs 0-9 with a "9+"
# overflow, all verified by rendering U+F0C9C..U+F0CB3 from the font rather than
# trusting a charset lookup.
PaneNumOn="#{?#{==:#{pane_index},0},󰲞,#{?#{==:#{pane_index},1},󰲠,#{?#{==:#{pane_index},2},󰲢,#{?#{==:#{pane_index},3},󰲤,#{?#{==:#{pane_index},4},󰲦,#{?#{==:#{pane_index},5},󰲨,#{?#{==:#{pane_index},6},󰲪,#{?#{==:#{pane_index},7},󰲬,#{?#{==:#{pane_index},8},󰲮,#{?#{==:#{pane_index},9},󰲰,󰲲}}}}}}}}}}"
PaneNumOff="#{?#{==:#{pane_index},0},󰲟,#{?#{==:#{pane_index},1},󰲡,#{?#{==:#{pane_index},2},󰲣,#{?#{==:#{pane_index},3},󰲥,#{?#{==:#{pane_index},4},󰲧,#{?#{==:#{pane_index},5},󰲩,#{?#{==:#{pane_index},6},󰲫,#{?#{==:#{pane_index},7},󰲭,#{?#{==:#{pane_index},8},󰲯,#{?#{==:#{pane_index},9},󰲱,󰲳}}}}}}}}}}"
# Pane header: a rounded pill on the border line, carrying a numbered circle,
# the pane's program glyph (the same WinIcon chain the window pills use, so a
# pane and a tab are labelled identically) and the command.
#
# Same construction as the status pills: caps drawn in the fill colour against
# bg=default, which on the border line is the terminal background rather than
# the bar. Active is blue (sky while the prefix is held) with crust text;
# inactive is surface0 with text, matching an unfocused window pill.
#
# The circle is FILLED on the active pane and outline elsewhere, so the focused
# pane is legible from shape alone, not just from colour. Panes are 0-indexed
# here (pane-base-index 0) and the glyph family runs 0-9 with a "9+" overflow,
# all verified by rendering U+F0C9C..U+F0CB3 from the font rather than trusting
# a charset lookup. Note the family alternates filled/outline, so digits step
# by 2: filled(N) = 0xF0C9E + 2N, outline(N) = 0xF0C9F + 2N.
set -g pane-border-format "#{?pane_active,#{?client_prefix,#[fg=$Sky],#[fg=$Blue]},#[fg=$Surface0]}#[bg=default]#{?pane_active,#{?client_prefix,#[bg=$Sky],#[bg=$Blue]},#[bg=$Surface0]}#{?pane_active,#[fg=$Crust],#[fg=$Text]} #{?pane_active,$PaneNumOn,$PaneNumOff} $WinIcon #{pane_current_command} #{?pane_active,#{?client_prefix,#[fg=$Sky],#[fg=$Blue]},#[fg=$Surface0]}#[bg=default]#[default]"
set -g pane-border-lines "double"
# GUARD: popup-border-lines, popup-border-style and popup-style are all tmux 3.4.
# On 3.2/3.3 they are unknown options and every one raises an error on load, which
# is what the older box complained about. The popups still work there -- only the
# styling is skipped -- because display-popup itself is 3.2.
#
# Version test notes: #{version} is like "3.7b", so the letter is stripped, and
# the comparison is done on major/minor SEPARATELY with the math form
# #{e|>=|:...}. Plain #{>=:...} compares strings, so a future "3.10" would read
# as lower than "3.4" and silently skip these. Verified against 3.2 .. 4.0.
%if '#{||:#{e|>|:#{s/\..*$//:#{s/[a-z]//:version}},3},#{&&:#{==:#{s/\..*$//:#{s/[a-z]//:version}},3},#{e|>=|:#{s/^.*\.//:#{s/[a-z]//:version}},4}}}'
    set -g popup-border-lines "rounded"
# Popups are BASE, not mantle. Mantle is now kitty's default background, and
# background_opacity only applies to cells matching the default -- so a mantle
# popup went translucent and its border nearly vanished against the wallpaper.
# Base differs from the default, so the popup renders solid and reads as a thing
# floating above the terminal.
#
# Rounded, in mauve: rounded to match the pills and the waybar islands' radius,
# and mauve because it is the primary accent everywhere else and nothing a popup
# overlaps is competing for it.
    set -g popup-border-style "fg=$Mauve"
    set -g popup-style "bg=$Base,fg=$Text"
%endif

# Colours come from window-status-format above; these must not fight it.
set -g window-status-bell-style "default"
set -g window-status-activity-style "default"

# (dropped: status-style above already sets bg=$Surface0)

# Date and clock: one connected island, the join a LEFT cap drawn in the clock's
# colour on the date's background, so the curve bites inward between the two
# fills instead of separating them. Only the outer edges are outward caps.
#
# Holding the prefix lights the island up too, the same way the session badge and
# the active window pill do: peach -> sky, lavender -> sapphire. Two different
# blues rather than one, so the inward join does not vanish into a single block.
# ---- alert pill ---------------------------------------------------------
# The pill counts UNACKNOWLEDGED alerts from ~/.cache/tmux-alerts.log, published
# by tmux-alert-log into the user options @alerts_unread / @alerts_kind. Formats
# read user options with no subprocess, so this still costs nothing per redraw.
#
# It deliberately does NOT use the live window flags. tmux clears a bell flag
# only when the window is actually viewed and gives no way to dismiss one --
# toggling monitor-bell off and on does not clear it (tested) -- so a
# flag-driven pill could never be marked as read. Acknowledging happens in the
# viewer: d dismisses one, A marks all read, Enter clears the one you jump to.
#
# Activity is excluded from the count: monitor-activity is on, so it fires on any
# background output and would keep the pill permanently lit. The window pills
# already show activity in yellow.
#
# NB no commas inside a #{?...} branch -- a comma ends the branch, hence one
# #[...] per attribute. range=user|alerts makes the pill clickable, arriving in
# #{mouse_status_range} (15 bytes max).
AlertPill="#{?#{@alerts_unread},#{?#{==:#{@alerts_kind},bell},#[range=user|alerts]#[fg=$Red]#[bg=default]#[fg=$Crust]#[bg=$Red]#[bold] 󰂚 #{p2:@alerts_unread} #[fg=$Red]#[bg=default]#[nobold]#[norange] ,#[range=user|alerts]#[fg=$Yellow]#[bg=default]#[fg=$Crust]#[bg=$Yellow]#[bold] 󰤄 #{p2:@alerts_unread} #[fg=$Yellow]#[bg=default]#[nobold]#[norange] },}"

set -g status-right "$AlertPill#{?client_prefix,#[fg=$Sky],#[fg=$Peach]}#[bg=default,bold]#{?client_prefix,#[bg=$Sky],#[bg=$Peach]}#[fg=$Crust,bold] %a %d-%m-%Y 󰃭 #{?client_prefix,#[fg=$Sapphire],#[fg=$Lavender]}#{?client_prefix,#[bg=$Sky],#[bg=$Peach]}#{?client_prefix,#[bg=$Sapphire],#[bg=$Lavender]}#[fg=$Crust,bold] %H:%M 󰥔 #{?client_prefix,#[fg=$Sapphire],#[fg=$Lavender]}#[bg=default,nobold]"
set -g window-status-separator " "

#-------------------------------------#
#       Alerts: log, viewer, watch
#-------------------------------------#
# Every alert is appended to ~/.cache/tmux-alerts.log with the window's panes and
# the command each was running. tmux cannot say WHICH pane rang: hook_pane is
# empty for bell, activity and silence alike and no pane-level alert flag exists,
# so all panes are recorded and a one-pane window is unambiguous.
set-hook -g alert-bell     'run-shell -b "$HOME/.local/bin/tmux-alert-log bell #{hook_window}"'
set-hook -g alert-activity 'run-shell -b "$HOME/.local/bin/tmux-alert-log activity #{hook_window}"'
set-hook -g alert-silence  'run-shell -b "$HOME/.local/bin/tmux-alert-log silence #{hook_window}"'

bind-key N display-popup -E -w 70% -h 50% "$HOME/.local/bin/tmux-alerts"

# Clicking the pill opens the viewer; clicking elsewhere on the status line keeps
# the default behaviour (switch-client -t =).
bind-key -T root MouseDown1Status \
  if-shell -F '#{==:#{mouse_status_range},alerts}' \
    'display-popup -E -w 70% -h 50% "$HOME/.local/bin/tmux-alerts"' \
    'switch-client -t ='

# "Tell me when this window goes quiet." monitor-silence stays off globally --
# every idle window would fire -- so this arms it for the current window only,
# which is as close as tmux gets to "ping me when this job stops printing".
# NB the test reads the OPTION #{monitor-silence} (is the watch armed?), not
# #{window_silence_flag}, which merely says an alert is pending -- with that, the
# toggle flipped the wrong way whenever an alert was already waiting.
bind-key W if-shell -F '#{==:#{monitor-silence},0}' \
  'set-window-option monitor-silence 15 ; display-message "silence watch ON (15s)"' \
  'set-window-option monitor-silence 0 ; display-message "silence watch off"'


#-------------------------------------#
#       Work around for colors
#-------------------------------------#
set-option -g xterm-keys on
set-option -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ',tmux-256color:RGB,screen-256color:RGB'

# Truecolor for terminals whose terminfo does not advertise it. The line above
# names INNER terms (what tmux sets inside a pane), so it only ever helps a
# nested tmux -- a plain client is judged by its own terminfo, and kitty passes
# only because xterm-kitty carries Tc and kitty exports COLORTERM=truecolor.
#
# xterm-256color carries NEITHER, which is what Windows Terminal reports under
# WSL. tmux then approximates every hex to the 256-colour palette, and the two
# greys this bar depends on collapse into near-identical darks:
#     mantle   #181825 -> index 234 #1c1c1c   (bar)
#     surface0 #313244 -> index 237 #3a3a3a   (pills)
# so the pills stop reading as pills. Windows Terminal does do 24-bit colour;
# nothing was telling tmux that. Needs tmux >= 3.2 for terminal-features.
set-option -as terminal-features ',xterm-256color:RGB'
set-option -as terminal-features ',xterm-kitty:RGB'

# set window notifications
set-option -g visual-activity off
set-window-option -g monitor-activity on

# (dropped ",xterm-256color:Tc": TERM inside tmux is never xterm-256color,
#  and the RGB override above is the modern spelling of the same thing.)

set-window-option -g mode-keys vi
set-option -g history-limit 50000

# run-shell ~/.tmux/plugins/tmux-sensible/sensible.tmux
# run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux
# run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore nvim with its SESSION, not just its directory: on restore, if the
# pane's directory contains a Session.vim, resurrect launches `nvim -S` instead
# of a bare nvim, bringing back buffers, splits and cursor positions.
#
# Session.vim has to be written by nvim itself -- tpope/vim-obsession does it
# continuously (see ~/.config/nvim/lua/plugins/obsession.lua), which matters
# here because the point is surviving a reboot, and an on-exit autocmd would not
# fire on a hard one. Run :Obsession once in a project to start tracking it.
#
# nvim is already in resurrect's default process list (vi vim view nvim emacs man
# less more tail top htop irssi weechat mutt), so no @resurrect-processes needed.
set -g @resurrect-strategy-nvim "session"
set -g @resurrect-capture-pane-contents 'on'

# fastfetch's logo is a kitty image: the picture is transmitted out of band and
# the grid keeps U+10EEEE placeholder cells pointing at it. capture-pane-contents
# saves those cells as text, but the image dies with the kitty process -- so a
# restored pane showed a block of garbage where the logo had been. This hook
# blanks the placeholders at save time, keeping the info block beside them.
set -g @resurrect-hook-post-save-all '$HOME/.local/bin/tmux-resurrect-strip-images'

set -g @continuum-boot 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

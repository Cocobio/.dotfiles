dynamic_background_opacity  yes
background_opacity          0.6
cursor_trail                1
window_padding_width        3

include themes/mocha.conf


# BEGIN_KITTY_FONTS
font_family      family="CaskaydiaCove Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14
# END_KITTY_FONTS

include themes/noctalia.conf

# Default background is MANTLE, not base -- deliberately, and it is what makes
# the tmux status bar translucent.
#
# background_opacity only applies to cells whose background equals the DEFAULT
# background (kitty.conf(5): "so that things like the status bar in vim,
# powerline prompts, etc. still look good"). It compares the colour value, not
# how it was set. The tmux bar paints #181825, so with base #1e1e2e as the
# default every cell of it was fully opaque -- a solid band across an otherwise
# 60%-transparent terminal. Matching the default to it lets the bar take the
# window opacity while the surface0 pills, being a different colour, stay solid:
# the same structure waybar has, where the island is translucent and its pills
# are not.
background #181825

# ── Tab bar ───────────────────────────────────────────────────────────────
# Kept outside the machine-managed fonts block above: `kitten choose-fonts`
# rewrites that block wholesale and would delete anything stored inside it.
# Placed after the theme includes, which is where tab *colours* come from
# (noctalia.conf wins over mocha.conf, being included last).
tab_bar_edge              bottom
tab_bar_style             custom
tab_powerline_style       round
tab_bar_align             center
tab_bar_min_tabs          1
tab_bar_margin_width      0.0
tab_bar_margin_height     0.0 0.0
tab_title_max_length      24
active_tab_font_style     bold
inactive_tab_font_style   normal
tab_activity_symbol       "● "
bell_on_tab               "󰂚 "
tab_title_template        "{activity_symbol}{title[:1] + ' ' if title[:1] >= '' else '󰈚 ' if tab.active_exe in ('nvim','vim','vi','hx','helix') else '󰌠 ' if tab.active_exe in ('python','python3','ipython','uv') else '󰎙 ' if tab.active_exe in ('node','npm','pnpm','yarn','bun','deno') else '󱘗 ' if tab.active_exe in ('cargo','rustc','rustup') else '󰟓 ' if tab.active_exe in ('go','gopls') else '󰊢 ' if tab.active_exe in ('git','lazygit','tig','gh') else '󰡨 ' if tab.active_exe in ('docker','podman','lazydocker','kubectl') else '󰄨 ' if tab.active_exe in ('top','htop','btop','btm','bottom','atop','nvtop','radeontop') else '󰣀 ' if tab.active_exe in ('ssh','mosh','sshfs','rsync','scp') else '󰍉 ' if tab.active_exe in ('rg','grep','fd','find','fzf','ag') else '󰈙 ' if tab.active_exe in ('man','less','bat','more','info') else '󰉋 ' if tab.active_exe in ('yazi','ranger','nnn','lf','mc','broot') else '󰆼 ' if tab.active_exe in ('psql','mysql','sqlite3','redis-cli','mongosh','duckdb') else '󰇧 ' if tab.active_exe in ('curl','wget','http','xh','aria2c') else '󰏔 ' if tab.active_exe in ('pacman','paru','yay','apt','dnf','flatpak','pip') else '󰒓 ' if tab.active_exe in ('systemctl','journalctl','systemd-analyze') else '󰖩 ' if tab.active_exe in ('nmtui','nmcli','iwctl','bluetoothctl') else '󰕼 ' if tab.active_exe == 'vlc' else '󰕧 ' if tab.active_exe in ('mpv','ffmpeg','yt-dlp') else '󰚩 ' if tab.active_exe in ('claude','aider','ollama') else '󰆍 '}{title[2:] if title[:1] >= '' else title}"
active_tab_title_template "{activity_symbol}{title[:1] + ' ' if title[:1] >= '' else '󰈚 ' if tab.active_exe in ('nvim','vim','vi','hx','helix') else '󰌠 ' if tab.active_exe in ('python','python3','ipython','uv') else '󰎙 ' if tab.active_exe in ('node','npm','pnpm','yarn','bun','deno') else '󱘗 ' if tab.active_exe in ('cargo','rustc','rustup') else '󰟓 ' if tab.active_exe in ('go','gopls') else '󰊢 ' if tab.active_exe in ('git','lazygit','tig','gh') else '󰡨 ' if tab.active_exe in ('docker','podman','lazydocker','kubectl') else '󰄨 ' if tab.active_exe in ('top','htop','btop','btm','bottom','atop','nvtop','radeontop') else '󰣀 ' if tab.active_exe in ('ssh','mosh','sshfs','rsync','scp') else '󰍉 ' if tab.active_exe in ('rg','grep','fd','find','fzf','ag') else '󰈙 ' if tab.active_exe in ('man','less','bat','more','info') else '󰉋 ' if tab.active_exe in ('yazi','ranger','nnn','lf','mc','broot') else '󰆼 ' if tab.active_exe in ('psql','mysql','sqlite3','redis-cli','mongosh','duckdb') else '󰇧 ' if tab.active_exe in ('curl','wget','http','xh','aria2c') else '󰏔 ' if tab.active_exe in ('pacman','paru','yay','apt','dnf','flatpak','pip') else '󰒓 ' if tab.active_exe in ('systemctl','journalctl','systemd-analyze') else '󰖩 ' if tab.active_exe in ('nmtui','nmcli','iwctl','bluetoothctl') else '󰕼 ' if tab.active_exe == 'vlc' else '󰕧 ' if tab.active_exe in ('mpv','ffmpeg','yt-dlp') else '󰚩 ' if tab.active_exe in ('claude','aider','ollama') else '󰆍 '}{title[2:] if title[:1] >= '' else title}"

set -g status-right-length 150

#+--- Bars LEFT ---+
# Session name
set-option -g status-left-length 60
# Session badge: glyph, a dimmed separator dot, then the name -- the same
# glyph-dot-name shape as the kitty tab titles and set-titles-string.
#
# Prefix is signalled two ways at once, so it survives both a glance and a
# colour-blind reading: the pill turns sky, AND the session glyph becomes a
# lightning bolt. Both glyphs are single-width, so nothing shifts.
#
# The fixed widths are what make status-justify centre actually centre. tmux
# centres the window list in the GAP BETWEEN status-left and status-right, not
# in the whole bar, so unequal sides pull the list toward the narrower one -- it
# was 6 columns left of centre. Hence two paddings:
#
#   * the name is padded/truncated to exactly 10 columns (#{=10;p10:...}, the
#     same fixed-width trick waybar/scripts/appname uses), so the badge never
#     changes width with the session name;
#   * the 12 trailing SPACES below are 30 - 18: this side renders 18 columns and
#     the date+clock island renders 30, so without them the list sits 6 columns
#     left of centre. They are not decorative -- measure both sides before
#     touching them.
#
# The alert pill adds a further 9 columns to the right when it is up, so the
# same 9 are added here under the same condition; otherwise the whole window
# list jumps 4 columns sideways every time something rings. The pill's count is
# #{p2:...} for exactly this reason: a constant width up to 99 alerts, so the
# compensation stays a fixed number rather than tracking the digit count.
set -g status-left "#[bold]#{?client_prefix,#[fg=$Sky],#[fg=$Lavender]}#[bg=default]#{?client_prefix,#[bg=$Sky],#[bg=$Lavender]}#[fg=$Crust] #{?client_prefix,,} #[fg=$Surface1,nobold]·#[fg=$Crust,bold] #{=10;p10:session_name} #{?client_prefix,#[fg=$Sky],#[fg=$Lavender]}#[bg=default]            #{?#{@alerts_unread},         ,}"

# The active window pill is coloured by its index, mapped onto the waybar
# workspace pills (1 mauve, 2 blue, 3 green, 4 peach, 5 pink, 6 teal, 7 yellow,
# 8 red, 9 lavender). Window 0 has no workspace counterpart -- waybar starts at
# 1 -- so it gets sapphire, which is in the bar palette but outside the nine.
# Sky is the prefix accent, likewise outside the nine, so "prefix held" can
# never be read as "window N". Past 9 it goes neutral.
# Split into two variables that emit COMPLETE #[...] styles, instead of one
# variable holding a bare colour used as #[fg=$WinIdx].
#
# A format nested INSIDE a style spec -- #[fg=#{?...}] -- is only expanded by
# newer tmux: on 3.7b `#{E:window-status-current-format}` shows it already
# resolved to #[fg=#74c7ec], but on 3.4 and 3.2 the style is malformed and takes
# the following text with it, which is why the ACTIVE pill lost its icon there
# while inactive pills (which emit whole styles from each branch, like WinFg
# below) were fine. Emitting the whole style keeps it working on every version.
WinIdxFg="#{?#{==:#{window_index},0},#[fg=$Sapphire],#{?#{==:#{window_index},1},#[fg=$Mauve],#{?#{==:#{window_index},2},#[fg=$Blue],#{?#{==:#{window_index},3},#[fg=$Green],#{?#{==:#{window_index},4},#[fg=$Peach],#{?#{==:#{window_index},5},#[fg=$Pink],#{?#{==:#{window_index},6},#[fg=$Teal],#{?#{==:#{window_index},7},#[fg=$Yellow],#{?#{==:#{window_index},8},#[fg=$Red],#{?#{==:#{window_index},9},#[fg=$Lavender],#[fg=$Subtext0]}}}}}}}}}}"
WinIdxBg="#{?#{==:#{window_index},0},#[bg=$Sapphire],#{?#{==:#{window_index},1},#[bg=$Mauve],#{?#{==:#{window_index},2},#[bg=$Blue],#{?#{==:#{window_index},3},#[bg=$Green],#{?#{==:#{window_index},4},#[bg=$Peach],#{?#{==:#{window_index},5},#[bg=$Pink],#{?#{==:#{window_index},6},#[bg=$Teal],#{?#{==:#{window_index},7},#[bg=$Yellow],#{?#{==:#{window_index},8},#[bg=$Red],#{?#{==:#{window_index},9},#[bg=$Lavender],#[bg=$Subtext0]}}}}}}}}}}"
# set -g window-status-current-format "#[fg=$Surface4,bg=$Pink]#[fg=$Base,bg=$Pink] #I  #W #{?window_last_flag,,} #[fg=$Pink,bg=$Surface0]"
set -g window-status-current-format "#{?client_prefix,#[fg=$Sky],$WinIdxFg}#[bg=default]#{?client_prefix,#[bg=$Sky],$WinIdxBg}#[fg=$Crust,bold]#{?window_zoomed_flag,󰊓 ,$WinIcon }#I  #W #{?window_last_flag,,}#{?client_prefix,#[fg=$Sky],$WinIdxFg}#[bg=default]"
# A belled window turns red, one with unseen output turns yellow, otherwise the
# pill is surface0 -- the same fill waybar gives #custom-wsN, now that the bar
# behind it is mantle and there is something for surface0 to read against.
#
# The colours live in the format rather than in window-status-bell-style /
# window-status-activity-style: this format sets colours inline, and inline
# #[...] directives are applied after the style, so those options were being
# overridden (and `reverse` mangled the tab outright).
WinFg="#{?window_bell_flag,#[fg=$Red],#{?window_activity_flag,#[fg=$Yellow],#[fg=$Surface0]}}"
WinBg="#{?window_bell_flag,#[bg=$Red],#{?window_activity_flag,#[bg=$Yellow],#[bg=$Surface0]}}"
WinTxt="#{?window_bell_flag,#[fg=$Crust],#{?window_activity_flag,#[fg=$Crust],#[fg=$Text]}}"
# Per-pane program icon, generated by gen-tab-icons from the same ICONS table
# that feeds the kitty tab templates and set-titles-string -- so a tab looks the
# same in kitty's tab bar and in tmux's status line. Placeholder; run
# gen-tab-icons to fill it in.
# Default for the ssh pane icon, referenced FLAT as #{@ssh_icon} inside
# WinIcon. ~/.config/zsh/ssh-icons.zsh overrides it per WINDOW while a
# connection is open, and a window option falls back to this global value
# when unset -- so a machine without the wrapper (bash, or a bare scp) still
# shows the generic remote glyph instead of nothing.
#
# Flat on purpose: as #{?#{@ssh_icon},#{@ssh_icon},<glyph>} it worked on 3.7b
# but lost the icon on tmux 3.4 for the CURRENT window only -- that branch is
# the deepest in the chain and the active format nests one level further.
# Kept in sync with the ICONS table by gen-tab-icons.
set -g @ssh_icon "󰣀"

